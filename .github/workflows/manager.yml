name: Mod Manager
on:
  push:
    branches: [main]
    tags: ['manager-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manager/requirements*.txt
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r manager/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m manager --smoke-test
      - name: Capture native desktop layouts
        run: |
          python -m manager --source . --screenshot dist/ui-qa/desktop.png --size 1120x800
          python -m manager --source . --screenshot dist/ui-qa/small-desktop.png --size 1024x768
      - run: python tools/build_famswap_package.py 1.0
      - run: python tools/build_manager.py
      - name: Packaged startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/manager/PUKEY-Mod-Manager/PUKEY-Mod-Manager.exe' -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Packaged startup timed out' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed: $($process.ExitCode)" }
      - name: Packaged startup (Linux)
        if: runner.os == 'Linux'
        run: timeout 30s dist/manager/PUKEY-Mod-Manager/PUKEY-Mod-Manager --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: ui-qa-${{ runner.os }}
          path: dist/ui-qa/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: manager-${{ runner.os }}
          path: |
            dist/PUKEY-Mod-Manager-*.zip
            dist/PUKEY-Mod-Manager-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/manager-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: manager-*
          merge-multiple: true
      - name: Publish verified bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --title "PUKEY Mod Manager ${TAG#manager-v}" --notes "Standalone Windows and Linux desktop bundles. Extract the full folder, then run PUKEY-Mod-Manager. The app fetches the mod catalogue from GitHub. Proton gameplay compatibility remains unverified." --prerelease
